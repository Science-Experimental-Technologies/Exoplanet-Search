name: Release

"on":
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  publish:
    name: Build and publish platform bundles
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out tagged revision
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-core.txt

      - name: Install deterministic core
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-core.txt

      - name: Verify tagged revision
        run: |
          python scripts/check_release_metadata.py "${GITHUB_REF_NAME#v}"
          python -m pip check
          python -m pytest -m "not network"

      - name: Build and test standalone wheel
        run: |
          python -m pip wheel --no-deps --wheel-dir dist/wheels .
          python scripts/check_wheel.py dist/wheels
          python scripts/check_installed_package.py dist/wheels

      - name: Build Windows, macOS, and Linux bundles
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: python scripts/build_release_bundles.py --version "${RELEASE_VERSION#v}" --extra-file dist/wheels/*.whl --extra-file output/pdf/sxs_preprint_v1.0.0.pdf

      - name: Attest release payloads
        uses: actions/attest@v4
        with:
          subject-path: dist/**

      - name: Attest archived research PDF
        uses: actions/attest@v4
        with:
          subject-path: output/pdf/sxs_preprint_v1.0.0.pdf

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: SXS ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## Platform downloads

            These archives contain the same Python source and scientific record, with a platform-specific installation guide at `PLATFORM_INSTALL.md`.

            - **Windows:** `sxs-${{ github.ref_name }}-windows-python.zip`
            - **macOS:** `sxs-${{ github.ref_name }}-macos-python.tar.gz`
            - **Linux:** `sxs-${{ github.ref_name }}-linux-python.tar.gz`

            The attached `scix_exoplanet_search-*.whl` installs with `python -m pip install <wheel-file>` in a clean Python environment. Then run `sxs demo`. Default workflow configurations are bundled. All five attached payloads are covered by `SHA256SUMS.txt`.

            Python 3.11 or 3.12 is required. SXS is scientific software, not a standalone graphical application. Candidate outputs are unconfirmed and require independent review.

            Current revisions use the SXS Source-Available Commercial License 1.0. Review `LICENSE`, `NOTICE`, and `COMMERCIAL_USE.md` before redistribution or commercial use.
          files: |
            dist/sxs-*-windows-python.zip
            dist/sxs-*-macos-python.tar.gz
            dist/sxs-*-linux-python.tar.gz
            dist/SHA256SUMS.txt
            dist/wheels/*.whl
            output/pdf/sxs_preprint_v1.0.0.pdf
          fail_on_unmatched_files: true
