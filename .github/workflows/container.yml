name: Container package

"on":
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "src/**"
      - "configs/**"
      - "tests/**"
      - "scripts/check_documentation.py"
      - "reports/benchmark_metrics.json"
      - "requirements*.txt"
      - "Dockerfile"
      - ".dockerignore"
      - "LICENSE"
      - "NOTICE"
      - "COMMERCIAL_USE.md"
      - "DISCLAIMER.md"
      - "README.md"
      - ".github/workflows/container.yml"
  pull_request:
    paths:
      - "src/**"
      - "configs/**"
      - "tests/**"
      - "scripts/check_documentation.py"
      - "reports/benchmark_metrics.json"
      - "requirements*.txt"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/container.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Choose image tags
        id: image
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "tags<<TAGS" >> "$GITHUB_OUTPUT"
          echo "$image:sha-$COMMIT_SHA" >> "$GITHUB_OUTPUT"
          if [[ "$EVENT_NAME" != "pull_request" && "$REF" == "refs/heads/main" ]]; then
            echo "$image:main" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" != "pull_request" && "$REF" == refs/tags/v* ]]; then
            echo "$image:$REF_NAME" >> "$GITHUB_OUTPUT"
          fi
          echo "TAGS" >> "$GITHUB_OUTPUT"

      - name: Build and load image for testing
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test actual image before publication
        env:
          IMAGE: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
        run: |
          docker run --rm "$IMAGE" --help
          docker run --rm "$IMAGE" baseline --config configs/base.yaml --dry-run
          docker run --rm "$IMAGE" baseline --config configs/base.yaml --to-stage 0
          docker run --rm --entrypoint python "$IMAGE" -m pip check
          docker run --rm --entrypoint python "$IMAGE" -c "import os, tensorflow, mlflow; assert os.getuid() == 10001"
          docker run --rm --entrypoint python \
            --mount type=bind,src="$GITHUB_WORKSPACE/tests",dst=/opt/sxs/tests,readonly \
            --mount type=bind,src="$GITHUB_WORKSPACE/scripts",dst=/opt/sxs/scripts,readonly \
            --mount type=bind,src="$GITHUB_WORKSPACE/reports/benchmark_metrics.json",dst=/opt/sxs/reports/benchmark_metrics.json,readonly \
            "$IMAGE" -m pytest -m "not network" -q -p no:cacheprovider

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tested image
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          IMAGE_TAGS: ${{ steps.image.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
