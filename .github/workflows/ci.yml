name: CI

"on":
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version:
          - "3.11"
          - "3.12"

    env:
      MPLBACKEND: Agg
      PYTHONUTF8: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-core.txt

      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-core.txt

      - name: Check dependency consistency
        run: python -m pip check

      - name: Run deterministic tests
        run: python -m pytest -m "not network"

      - name: Check recorded CLI previews
        run: python scripts/build_cli_previews.py --check

      - name: Check repository documentation
        run: python scripts/check_repository_docs.py

      - name: Verify built package layout and CLI
        run: |
          python -m pip wheel --no-deps --wheel-dir dist/wheels .
          python scripts/check_wheel.py dist/wheels
          python scripts/check_installed_package.py dist/wheels
