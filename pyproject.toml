[build-system]
requires = ["setuptools==75.8.2"]
build-backend = "setuptools.build_meta"

[project]
name = "scix-exoplanet-search"
version = "1.1.0"
description = "Reproducible exoplanet transit recovery pipeline using public light curves"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [
  { name = "Rasya Andrean" },
]
license = { file = "LICENSE" }
dynamic = ["dependencies"]

[project.urls]
Homepage = "https://www.rasyaandrean.my.id/"
Repository = "https://github.com/Science-Experimental-Technologies/Exoplanet-Search"
Documentation = "https://science-experimental-technologies.github.io/Exoplanet-Search/"

[project.scripts]
sxs = "src.cli:main"

[tool.setuptools]
license-files = ["LICENSE", "NOTICE"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements-core.txt"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "network: integration tests that access public astronomy services",
]
