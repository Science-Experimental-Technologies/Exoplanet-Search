project:
  name: SCIX Exoplanet Search
  version: sxs-candidate-search-v1
  random_seed: 42

paths:
  raw: data/raw/search_targets
  processed: data/search/processed
  catalog: data/search/catalog
  reports: reports

ingest:
  mission: Kepler
  cadence: long
  author: Kepler
  max_products: 4

preprocess:
  quality_bitmask: 1130799
  sigma_lower: 10.0
  sigma_upper: 5.0
  sigma_maxiters: 5
  max_gap_cadences: 3
  flatten_window_length: 401
  flatten_polyorder: 2
  flatten_break_tolerance: 5
  flatten_niters: 3
  flatten_sigma: 3.0

bls:
  minimum_period_days: 0.5
  maximum_period_days: 50.0
  durations_hours: [1.0, 2.0, 4.0, 8.0, 12.0]
  top_k: 5
  frequency_oversampling: 5.0
  duration_oversampling: 10
  minimum_peak_separation_fraction: 0.01
  include_interpolated: false
  objective: snr
  method: fast

candidate_search:
  sample_size: 250
  minimum_available_quarters: 8
  minimum_kepler_magnitude: 10.0
  maximum_kepler_magnitude: 15.0
  model_path: models/rf_v2.joblib
  model_selection: models/production_model_selection.json
  shortlist_size: 20
  required_label: unvalidated_candidate_requires_independent_confirmation
  odd_even_mismatch_max: 0.5
  secondary_to_primary_ratio_max: 0.2
  centroid_significance_max: 3.0
  artifacts:
    eligible_pool: data/search/catalog/eligible_unknown_pool.parquet
    selected_targets: data/search/catalog/selected_unknown_targets.yaml
    selection_summary: data/search/catalog/selection_summary.json
    processing_summary: data/search/processed/processing_summary.json
    candidates: data/search/processed/scored_candidates.parquet
    shortlist: data/search/processed/shortlist_top20.csv
    figures: reports/candidate_figures
    report: reports/candidate_screening.md
    catalog_recheck: reports/candidate_catalog_recheck.json
    run_record: reports/search_run_latest.json
