project:
  name: SCIX Exoplanet Search
  version: sxs-independent-validation-v1
  random_seed: 9042026

inputs:
  shortlist: data/search/processed/shortlist_top20.csv
  target_pool: data/search/catalog/eligible_unknown_pool.parquet
  processed_light_curves: data/search/processed

bls:
  minimum_period_days: 0.5
  maximum_period_days: 50.0
  durations_hours: [1.0, 2.0, 4.0, 8.0, 12.0]
  frequency_oversampling: 5.0
  duration_oversampling: 10
  objective: snr
  method: fast

fap:
  permutations_per_target: 1000
  workers: 8
  shuffle_method: independent_segment_circular_shift
  minimum_roll_fraction: 0.05

vetting:
  odd_even_p_threshold: 0.01
  secondary_sigma_threshold: 3.0
  secondary_depth_ratio_threshold: 0.1
  grazing_threshold: 1.0
  maximum_companion_radius_earth: 22.0
  gaia_cone_arcsec: 30.0
  gaia_high_risk_separation_arcsec: 4.0
  gaia_high_risk_delta_g: 5.0
  tess_search_radius_arcsec: 5.0
  tess_period_tolerance_fraction: 0.01
  tess_minimum_snr: 5.0
  exofop_match_radius_arcsec: 10.0

artifacts:
  directory: data/validation
  frozen_shortlist: data/validation/frozen_search_shortlist.parquet
  fap_results: data/validation/fap_results.parquet
  vetting_results: data/validation/independent_vetting.parquet
  gaia_sources: data/validation/gaia_sources.parquet
  crossmatch_results: data/validation/crossmatch_results.parquet
  final_ranking: data/validation/final_ranking.csv
  report: reports/independent_validation.md
  run_record: reports/validation_run_latest.json
